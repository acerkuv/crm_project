<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM Уют</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
<link rel="manifest" href="/manifest.json">
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('✅ Service Worker registered!', reg))
      .catch(err => console.log('❌ Service Worker registration failed:', err));
  });
}
</script>
<script>
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const btn = document.getElementById('install-btn');
  if (btn) btn.style.display = 'block';
});

window.addEventListener('DOMContentLoaded', () => {
  const btn = document.createElement('button');
  btn.id = 'install-btn';
  btn.textContent = '📱 Установить приложение';
  btn.style.cssText = 'display:none; position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:9999; padding:12px 24px; background:#1890ff; color:white; border:none; border-radius:8px; font-size:16px; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,0.2);';
  btn.onclick = () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then((result) => {
        if (result.outcome === 'accepted') {
          btn.style.display = 'none';
        }
        deferredPrompt = null;
      });
    }
  };
  document.body.appendChild(btn);
});
</script>
