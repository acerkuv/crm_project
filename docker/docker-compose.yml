version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: crm_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=crm_db
      - POSTGRES_USER=crm_user
      - POSTGRES_PASSWORD=secure_password_dev
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm_network

  redis:
    image: redis:7-alpine
    container_name: crm_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm_network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: crm_backend
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../backend:/app
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - ../.env.dev
    environment:
      - DJANGO_SETTINGS_MODULE=crm.settings.development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crm_network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: crm_frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - crm_network

  celery:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: crm_celery
    restart: always
    command: celery -A crm worker -l info --concurrency=4
    volumes:
      - ../backend:/app
      - media_volume:/app/media
    env_file:
      - ../.env.dev
    environment:
      - DJANGO_SETTINGS_MODULE=crm.settings.development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crm_network

  celery-beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: crm_celery_beat
    restart: always
    command: celery -A crm beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ../backend:/app
    env_file:
      - ../.env.dev
    environment:
      - DJANGO_SETTINGS_MODULE=crm.settings.development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crm_network

  flower:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: crm_flower
    restart: always
    command: celery -A crm flower --port=5555 --address=0.0.0.0
    ports:
      - "5555:5555"
    env_file:
      - ../.env.dev
    environment:
      - DJANGO_SETTINGS_MODULE=crm.settings.development
    depends_on:
      - celery
      - redis
    networks:
      - crm_network

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  crm_network:
    driver: bridge